<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Traces</title>
    <style>
      :root {
        --bg: #0c0d10;
        --panel: #121418;
        --rule: #262a31;
        --ink: #e9e7e0;
        --ink-2: #a7abb3;
        --amber: #ffc93c;
        --bad: #ff7a6b;
        --llm: #7fb4ff;
        --tool: #ffc93c;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 ui-sans-serif, system-ui, Segoe UI, sans-serif; font-variant-numeric: tabular-nums; }
      header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding: 16px; border-bottom: 1px solid var(--rule); }
      h1 { margin: 0; font-size: 18px; }
      nav button { background: none; border: 1px solid var(--rule); color: var(--ink-2); padding: 6px 12px; border-radius: 4px; cursor: pointer; font: inherit; }
      nav button[aria-pressed='true'] { border-color: var(--amber); color: var(--amber); }
      .meta { color: var(--ink-2); font-size: 13px; }
      main { padding: 16px; }
      .stats { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; color: var(--ink-2); }
      .stats b { color: var(--ink); font-size: 16px; }
      details { border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 8px; background: var(--panel); }
      summary { display: grid; grid-template-columns: 150px 1fr 90px 70px 110px; gap: 12px; padding: 10px 12px; cursor: pointer; align-items: center; }
      summary .input { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: right; }
      .flag { display: inline-block; margin-inline-end: 4px; padding: 0 6px; border: 1px solid var(--amber); color: var(--amber); border-radius: 3px; font-size: 12px; }
      .flag.bad { border-color: var(--bad); color: var(--bad); }
      .waterfall { padding: 8px 12px 14px; }
      .span { display: grid; grid-template-columns: 190px 1fr 70px; gap: 10px; align-items: center; font-size: 12.5px; margin: 3px 0; }
      .track { position: relative; height: 12px; background: #1a1d22; border-radius: 2px; }
      .bar { position: absolute; top: 0; height: 12px; border-radius: 2px; min-width: 2px; }
      .bar.llm { background: var(--llm); }
      .bar.tool { background: var(--tool); }
      .bar.fail { background: var(--bad); }
      .err { color: var(--bad); }
      pre { white-space: pre-wrap; color: var(--ink-2); font-size: 12px; margin: 8px 0 0; }
      table { width: 100%; border-collapse: collapse; }
      td, th { text-align: start; padding: 6px 8px; border-bottom: 1px solid var(--rule); font-size: 13px; }
      th { color: var(--ink-2); font-weight: 500; }
      .empty { color: var(--ink-2); padding: 24px 0; }
      @media (max-width: 720px) { summary { grid-template-columns: 1fr 70px; } summary .hide-sm { display: none; } .span { grid-template-columns: 120px 1fr 56px; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Agent traces</h1>
      <nav><button id="tab-traces" aria-pressed="true">Traces</button> <button id="tab-audit" aria-pressed="false">Audit log</button></nav>
      <span class="meta" id="meta"></span>
    </header>
    <main id="main"></main>
    <script>
      const token = new URLSearchParams(location.search).get('token') || '';
      const $ = (s) => document.querySelector(s);
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      const api = (p) => fetch(p, { headers: { 'x-admin-token': token } }).then((r) => (r.ok ? r.json() : Promise.reject(r.status)));
      const pct = (xs, p) => { if (!xs.length) return 0; const s = [...xs].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };

      async function traces() {
        const list = await api('/admin/api/traces');
        const done = list.filter((t) => t.outcome !== 'interrupted');
        const ms = done.map((t) => t.ms);
        $('#meta').textContent = list[0] ? `${list[0].version} · ${list[0].model} · prompt ${list[0].prompt}` : '';
        if (!list.length) return ($('#main').innerHTML = '<p class="empty">No traces yet. Ask the agent something.</p>');
        const errors = list.filter((t) => t.outcome === 'error').length;
        const grounding = list.filter((t) => t.flags.some((f) => f.startsWith('grounding'))).length;
        $('#main').innerHTML = `
          <div class="stats">
            <span>turns <b>${list.length}</b></span>
            <span>p50 <b>${(pct(ms, 0.5) / 1000).toFixed(1)}s</b></span>
            <span>p90 <b>${(pct(ms, 0.9) / 1000).toFixed(1)}s</b></span>
            <span>errors <b>${errors}</b></span>
            <span>grounding interventions <b>${grounding}</b></span>
            <span>tokens <b>${list.reduce((a, t) => a + t.usage.input_tokens + t.usage.output_tokens, 0).toLocaleString()}</b></span>
          </div>
          ${list.map(row).join('')}`;
      }

      function row(t) {
        const flags = [t.outcome !== 'ok' ? `<span class="flag ${t.outcome === 'error' ? 'bad' : ''}">${t.outcome}</span>` : '', ...t.flags.map((f) => `<span class="flag ${/error|redact/.test(f) ? 'bad' : ''}">${esc(f)}</span>`)].join('');
        const total = Math.max(t.ms, 1);
        const spans = t.spans
          .map((s) => `<div class="span"><span>${esc(s.kind)} · ${esc(s.name)}</span><span class="track"><span class="bar ${s.ok === false ? 'fail' : s.kind}" style="left:${(s.start / total) * 100}%;width:${((s.ms || 0) / total) * 100}%"></span></span><span>${s.ms ?? '…'}ms</span></div>${s.meta?.error ? `<div class="err">${esc(s.meta.error)}</div>` : ''}`)
          .join('');
        return `<details><summary>
            <span class="meta">${new Date(t.started).toLocaleTimeString()} · ${esc(t.channel)}</span>
            <span class="input">${esc(t.input)}</span>
            <span class="hide-sm">${(t.ms / 1000).toFixed(1)}s</span>
            <span class="hide-sm">${t.counters.agentSteps}↻ ${t.counters.toolCalls}⚙</span>
            <span>${flags || '<span class="meta">ok</span>'}</span>
          </summary><div class="waterfall">${spans}<pre>trace ${t.trace_id} · thread ${t.thread} · user ${t.user} · tokens in ${t.usage.input_tokens} / out ${t.usage.output_tokens}</pre></div></details>`;
      }

      async function auditLog() {
        const list = await api('/admin/api/audit');
        $('#main').innerHTML = list.length
          ? `<table><thead><tr><th>time</th><th>event</th><th>details</th></tr></thead><tbody>${list
              .map((e) => { const { ts, event, version, ...rest } = e; return `<tr><td class="meta">${new Date(ts).toLocaleString()}</td><td>${esc(event)}</td><td class="meta">${esc(JSON.stringify(rest))}</td></tr>`; })
              .join('')}</tbody></table>`
          : '<p class="empty">No policy events.</p>';
      }

      let view = traces;
      const show = (fn, btn) => { view = fn; document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-pressed', b === btn)); fn().catch((s) => ($('#main').innerHTML = `<p class="err">Failed to load (${s}). Check the token.</p>`)); };
      $('#tab-traces').onclick = (e) => show(traces, e.target);
      $('#tab-audit').onclick = (e) => show(auditLog, e.target);
      show(traces, $('#tab-traces'));
      setInterval(() => !document.querySelector('details[open]') && view().catch(() => {}), 5000);
    </script>
  </body>
</html>
